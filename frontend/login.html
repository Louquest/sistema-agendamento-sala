<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api/api.js"></script>
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h2>Entrar</h2>
        <p class="login-subtitle">Acesse sua conta</p>
        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required />
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" required />
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <div class="login-footer">
            Não tem conta? <a href="cadastro.html">Cadastrar</a>
        </div>
        <a href="index.html" class="link-voltar">← Voltar para o início</a>
    </div>
</div>
<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const senha = document.getElementById("loginSenha").value;
        
        console.log("🔐 Tentando login com:", email);
        
        try {
            const data = await login(email, senha);
            console.log("✅ Login realizado!", data.usuario);
            
            // Salva o usuário completo no localStorage com a SENHA
            const usuarioCompleto = {
                ...data.usuario,
                senha: senha  // Adiciona a senha digitada
            };
            localStorage.setItem("usuario", JSON.stringify(usuarioCompleto));
            
            // Verifica o tipo e redireciona
            if (data.usuario.tipo === 'funcionario' || data.usuario.tipo === 'admin') {
                console.log("👑 Usuário admin/funcionário, redirecionando para gerenciar.html");
                window.location.href = "gerenciar.html";
            } else {
                console.log("👤 Cliente comum, redirecionando para index.html");
                window.location.href = "index.html";
            }
        } catch (err) {
            console.error("❌ Erro no login:", err);
            alert("Erro: " + err.detail);
        }
    });
</script>
</body>
</html>
